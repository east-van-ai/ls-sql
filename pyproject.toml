[project]
name = "ls-sql"
version = "0.16.0"
description = "A pipeable extension of ls with SQL querying and file metadata harvesting."
readme = "README.md"
authors = [{ name = "East Van AI", email = "east-van-ai@proton.me" }]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Only what ls-sql imports. Floors, not pins: the floor is the version ls-sql
# was last tested against (2026-07-19), and a cap would be a guess about
# releases that do not exist yet. See DESIGN.md, "Dependencies are floors,
# not pins".
dependencies = [
    "mutagen>=1.47.0",
    "piexif>=1.1.3",
    "pillow>=12.2.0",
]

[project.scripts]
ls-sql = "lssql.cli:main"

# Local tooling, never shipped. A dependency group stays out of the wheel and
# off PyPI, which an optional-dependencies extra would not. Install with
# `pip install -e . --group dev` (needs pip 25.1+).
[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest",
    "pytest-cov",
    "ruff==0.16.0",
]

[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files` above are
# rejected by older setuptools, which still expects license = {text = "MIT"}.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Deliberately no [tool.ruff.lint] select -- ls-sql runs ruff's full default
# rule set and passes all of it. Narrowing to a hand-written list would
# silently stop enforcing most of it. The exact-version pin in the dev group
# is what freezes the rule set: ruff 0.16 expanded its defaults, which turned
# a green repo red without a line of code changing.

[tool.pytest.ini_options]
# sys capture required for Option A subprocess tests (local only, skipped in CI)
addopts = "--capture=sys"
testpaths = ["tests"]
