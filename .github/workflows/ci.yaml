# GitHub CI/CD workflow for Python project
# Always runs tests then lint (ruff + black) on push to main and pull requests
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install dependencies
        # the pip upgrade is load-bearing: --group needs pip 25.1 or newer
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - name: pytest
        run: pytest
      - name: lint
        run: |
          ruff check src tests
          black --target-version py314 --check src/ tests/
